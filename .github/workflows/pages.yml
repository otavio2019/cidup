name: Publicar frontend no GitHub Pages

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /cidup/
          # Defina em Settings > Secrets and variables > Actions > Variables (URL HTTPS do backend).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Pages não conhece as rotas do React; o 404.html carrega o app e o roteador assume.
      - run: cp dist/index.html dist/404.html
      # Publica o build na branch gh-pages (Settings > Pages > Deploy from a branch > gh-pages / root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
