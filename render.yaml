services:
  - type: web
    name: cidup-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RESPONSAVEL_NAME
        sync: false
      - key: RESPONSAVEL_EMAIL
        sync: false
      - key: RESPONSAVEL_PHONE
        sync: false
      - key: RESPONSAVEL_PASSWORD
        sync: false
      - key: RESPONSAVEL_ORGAO_ID
        value: "1"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
